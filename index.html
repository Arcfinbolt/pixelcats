<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1420">
<title>Ember the Fire Cat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Nunito:wght@400;700&display=swap">
<style>
  /* Layout: one centered game screen in a warm dark frame, controls legend below. Single dark look by design. */
  :root {
    --bg: #1b1420; --panel: #2a1d2c; --ink: #f6e6d4; --muted: #b9a2a6; --ember: #ffb347; --volt: #f0dc5a; --frost: #9fd6ff;
    --display: "Silkscreen", "Courier New", monospace; --body: "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(18px, 3.2vw, 28px); margin: 0; letter-spacing: 0.04em; text-wrap: balance; text-align: center; }
  h1 .e { color: var(--ember); } h1 .v { color: var(--volt); } h1 .f { color: var(--frost); } h1 .s { color: var(--muted); }
  .stage { position: relative; width: min(100%, calc((100vh - 150px) * 384 / 224), 1152px); aspect-ratio: 384 / 224; max-width: 100%;
    background: #000; box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px #3d2733, 0 18px 50px rgba(226, 86, 58, 0.18); border-radius: 4px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  .keys { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 14px; color: var(--muted); margin: 0; max-width: 76ch; }
  .keys b { font-family: var(--display); font-weight: 400; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid #4a3340; border-bottom-width: 2px; border-radius: 3px; padding: 1px 6px; margin-right: 4px; }
  /* touch controls: a slide-able left/right pad and two action buttons; shown only on touch screens */
  .touch { display: none; width: 100%; justify-content: space-between; align-items: center; gap: 12px; box-sizing: border-box;
    padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
  .touch, .touch * { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .pad { position: relative; width: 168px; height: 76px; border-radius: 38px; border: 2px solid #5a3f4c; background: rgba(42, 29, 44, 0.86); display: flex; }
  .pad span { flex: 1; display: grid; place-items: center; font-size: 26px; color: var(--muted); border-radius: 38px; }
  .pad span + span { border-left: 2px solid #4a3340; border-radius: 0 38px 38px 0; } .pad span:first-child { border-radius: 38px 0 0 38px; }
  .pad.L .l, .pad.R .r { background: #4a2f3c; color: var(--ink); }
  .acts { display: flex; gap: 16px; align-items: flex-end; }
  .acts button { width: 78px; height: 78px; border-radius: 50%; border: 2px solid #5a3f4c; background: rgba(42, 29, 44, 0.86); color: var(--ink); font-family: var(--display); font-size: 13px; padding: 0; }
  .acts .j { margin-bottom: 18px; }
  .acts button.on { background: #4a2f3c; transform: translateY(1px); }
  .acts .f { border-color: var(--pc, var(--ember)); color: var(--pc, var(--ember)); }
  @media (hover: none) and (pointer: coarse) {
    html, body { overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    body { justify-content: flex-start; gap: 12px; padding-block: max(14px, env(safe-area-inset-top, 0px)) 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
    .keys { display: none; } .touch { display: flex; margin-top: auto; padding-bottom: max(26px, env(safe-area-inset-bottom, 0px)); }
    .stage { width: 100%; max-width: 100%; }
  }
  /* phone held sideways: the game takes the middle, the pad sits in the left margin and the buttons stack in the right one */
  @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
    h1 { display: none; }
    body { padding: 0; justify-content: center; }
    .stage { width: auto; height: min(100vh, (100vw - 236px) * 224 / 384); height: min(100dvh, (100vw - 236px) * 224 / 384); max-width: 100vw; box-shadow: 0 0 0 2px var(--panel); border-radius: 0; }
    .touch { position: fixed; left: 0; right: 0; bottom: 0; top: 0; margin: 0; pointer-events: none; align-items: flex-end; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
    .touch > * { pointer-events: auto; }
    .pad { width: 108px; height: 70px; } .pad span { font-size: 22px; }
    .acts { flex-direction: column-reverse; align-items: center; gap: 12px; }
    .acts button { width: 74px; height: 74px; } .acts .j { margin-bottom: 0; }
  }
</style>

</head>
<body>
<h1><span class="e">Ember</span><span class="s"> · </span><span class="v">Volt</span><span class="s"> · </span><span class="f">Frost</span></h1>
<div class="stage" id="stage">
  <canvas id="c" width="384" height="224" aria-label="Cat platformer game screen"></canvas>
</div>
<div class="touch" id="touch">
  <div class="pad" id="pad" role="group" aria-label="Move left or right"><span class="l">&#9664;</span><span class="r">&#9654;</span></div>
  <div class="acts"><button class="j" data-k="jump" aria-label="Jump">JUMP</button><button class="f" data-k="fire" id="powerBtn" aria-label="Use power">FIRE</button></div>
</div>
<p class="keys"><span><b>&larr; &rarr;</b>walk (hold to run)</span><span><b>Z</b>or <b>Space</b> jump</span><span><b>X</b>power</span><span>Pick a cat on the title screen with <b>&larr; &rarr;</b>. Each cat has her own place to explore. Gather catnip, wake up the three small lights, then the big one at the end.</span></p>

<script>"use strict";

const P = {};

P.clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
P.lerp = (a, b, u) => a + (b - a) * u;
P.ease = {
  io: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  out: (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)),
  in: (u) => (u <= 0 ? 0 : Math.pow(2, 10 * u - 10)),
  sine: (u) => 0.5 - 0.5 * Math.cos(Math.PI * u),
  quad: (u) => 1 - (1 - u) * (1 - u),
};

P.rgb = (r, g, b) => ((0xff000000 | (b << 16) | (g << 8) | r) >>> 0);
P.col = (c) => (typeof c === "number" ? c : P.rgb(c[0] | 0, c[1] | 0, c[2] | 0));
P.mix = (a, b, u) => {
  u = P.clamp(u);
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
};
P.ramp = (cols, u) => {
  u = P.clamp(u) * (cols.length - 1);
  const i = Math.min(cols.length - 2, Math.floor(u));
  return P.mix(cols[i], cols[i + 1], u - i);
};
P.palette = (cols, n) => Array.from({ length: n }, (_, i) => P.col(P.ramp(cols, i / (n - 1))));

P.BT = new Float32Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16));
P.bt = (x, y) => P.BT[((y & 3) << 2) | (x & 3)];
P.ditherIndex = (v, n, x, y, width = 0.35) => {
  v = P.clamp(v, 0, 0.9999) * (n - 1);
  let k = Math.floor(v);
  const f = v - k;
  if ((f - (1 - width)) / width > P.bt(x, y)) k++;
  return Math.min(n - 1, k);
};

P.rng = (seed) => {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

P.hash = (a, b, s = 0) => {
  let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(s | 0, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
P.noise = (x, y, s = 0) => {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = P.hash(ix, iy, s), b = P.hash(ix + 1, iy, s), c = P.hash(ix, iy + 1, s), d = P.hash(ix + 1, iy + 1, s);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
};
P.fbm = (x, y, oct = 4, s = 0) => {
  let v = 0, amp = 0.5, f = 1, sum = 0;
  for (let i = 0; i < oct; i++) {
    v += P.noise(x * f, y * f, s + i * 17) * amp;
    sum += amp;
    amp *= 0.5;
    f *= 2;
  }
  return v / sum;
};

class Buf {
  constructor(w, h) {
    this.w = w;
    this.h = h;
    this.px = new Uint32Array(w * h);
    this.ox = 0;
    this.oy = 0;
  }

  clear(c = 0) {
    this.px.fill(c ? P.col(c) : 0);
  }

  put(i, c) {
    this.px[i] = c;
  }

  get(x, y) {
    x = Math.round(x) - this.ox;
    y = Math.round(y) - this.oy;
    return x < 0 || y < 0 || x >= this.w || y >= this.h ? 0 : this.px[y * this.w + x];
  }

  pset(x, y, c) {
    x = Math.round(x) - this.ox;
    y = Math.round(y) - this.oy;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    this.put(y * this.w + x, P.col(c));
  }

  rect(x0, y0, x1, y1, c) {
    c = P.col(c);
    const a = Math.max(Math.round(x0) - this.ox, 0), b = Math.min(Math.round(x1) - this.ox, this.w);
    const p = Math.max(Math.round(y0) - this.oy, 0), q = Math.min(Math.round(y1) - this.oy, this.h);
    for (let y = p; y < q; y++) for (let x = a; x < b; x++) this.put(y * this.w + x, c);
  }

  blob(cx, cy, r, color, dens = 1, edge = 0, sy = 1) {
    if (r <= 0 || dens <= 0) return;
    const c = P.col(color), R = r * (1 + edge);
    const x0 = Math.max(Math.floor(cx - R) - 1, this.ox), x1 = Math.min(Math.ceil(cx + R) + 1, this.ox + this.w - 1);
    const y0 = Math.max(Math.floor(cy - R * sy) - 1, this.oy), y1 = Math.min(Math.ceil(cy + R * sy) + 1, this.oy + this.h - 1);
    const span = R - r + 1e-6, lim = R * R;
    for (let y = y0; y <= y1; y++) {
      const dy = (y + 0.5 - cy) / sy, dy2 = dy * dy;
      if (dy2 > lim) continue;
      for (let x = x0; x <= x1; x++) {
        const dx = x + 0.5 - cx, q = dx * dx + dy2;
        if (q > lim) continue;
        const d = Math.sqrt(q);
        const den = edge > 0 ? dens * P.clamp((R - d) / span) : d <= r ? dens : 0;
        if (P.bt(x, y) < den) this.put((y - this.oy) * this.w + x - this.ox, c);
      }
    }
  }

  ring(cx, cy, r, width, color, dens = 1, sy = 1) {
    if (dens <= 0) return;
    const c = P.col(color), R = r + width;
    const x0 = Math.max(Math.floor(cx - R) - 1, this.ox), x1 = Math.min(Math.ceil(cx + R) + 1, this.ox + this.w - 1);
    const y0 = Math.max(Math.floor(cy - R * sy) - 1, this.oy), y1 = Math.min(Math.ceil(cy + R * sy) + 1, this.oy + this.h - 1);
    for (let y = y0; y <= y1; y++) {
      const dy = (y + 0.5 - cy) / sy;
      for (let x = x0; x <= x1; x++) {
        const dx = x + 0.5 - cx, d = Math.sqrt(dx * dx + dy * dy);
        if (d >= r && d <= R && P.bt(x, y) < dens) this.put((y - this.oy) * this.w + x - this.ox, c);
      }
    }
  }

  line(x0, y0, x1, y1, color, width = 1) {
    const c = P.col(color), n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)))), h = (width - 1) / 2;
    for (let i = 0; i <= n; i++) {
      const x = x0 + ((x1 - x0) * i) / n, y = y0 + ((y1 - y0) * i) / n;
      if (width <= 1) this.pset(x, y, c);
      else this.rect(x - h, y - h, x + h + 1, y + h + 1, c);
    }
  }

  poly(pts, color) {
    const c = P.col(color);
    let y0 = Infinity, y1 = -Infinity;
    for (const p of pts) {
      y0 = Math.min(y0, p[1]);
      y1 = Math.max(y1, p[1]);
    }
    y0 = Math.max(Math.floor(y0), this.oy);
    y1 = Math.min(Math.ceil(y1), this.oy + this.h - 1);
    const xs = [];
    for (let y = y0; y <= y1; y++) {
      const sy = y + 0.5;
      xs.length = 0;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) xs.push(a[0] + ((sy - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
      }
      xs.sort((p, q) => p - q);
      for (let i = 0; i + 1 < xs.length; i += 2) this.rect(Math.round(xs[i]), y, Math.round(xs[i + 1]) + 1, y + 1, c);
    }
  }

  sprite(s, x, y, flip = false) {
    for (let j = 0; j < s.h; j++)
      for (let i = 0; i < s.w; i++) {
        const c = s.px[j * s.w + (flip ? s.w - 1 - i : i)];
        if (c >>> 24) this.pset(x + i, y + j, c);
      }
  }

  field(fn, pal, width = 0.35) {
    const n = pal.length;
    for (let y = 0; y < this.h; y++)
      for (let x = 0; x < this.w; x++) {
        const wx = x + this.ox, wy = y + this.oy, v = fn(wx, wy);
        if (v == null || v <= 0) continue;
        this.put(y * this.w + x, pal[P.ditherIndex(v, n, wx, wy, width)]);
      }
  }

  dither(k, color) {
    if (k <= 0.02) return;
    const c = P.col(color);
    for (let y = 0; y < this.h; y++)
      for (let x = 0; x < this.w; x++) if (P.bt(x + this.ox, y + this.oy) < k) this.px[y * this.w + x] = c;
  }

  scaled(n) {
    const o = new Buf(this.w * n, this.h * n);
    for (let y = 0; y < o.h; y++) for (let x = 0; x < o.w; x++) o.px[y * o.w + x] = this.px[((y / n) | 0) * this.w + ((x / n) | 0)];
    return o;
  }

  rgba() {
    return new Uint8Array(this.px.buffer.slice(0));
  }
}
P.Buf = Buf;

P.unpack = (c) => [c & 255, (c >>> 8) & 255, (c >>> 16) & 255];

P.volley = (t0, n, opt = {}) => {
  const r = P.rng(opt.seed ?? 1), W = opt.w ?? 240, H = opt.h ?? 135, warn = opt.warn ?? 0.7, life = opt.life ?? 0.45;
  const [w0, w1] = opt.width ?? [5, 9], safe = opt.safe, out = [];
  for (let tries = 0; out.length < n && tries < 4000; tries++) {
    const a = r() * Math.PI, x = 10 + r() * (W - 20), y = 20 + r() * (H - 40), w = w0 + r() * (w1 - w0);
    if (safe && Math.abs((safe[0] - x) * Math.sin(a) - (safe[1] - y) * Math.cos(a)) < safe[2] + w) continue;
    const ts = t0 + (opt.stagger ?? 0) * out.length;
    out.push({ x, y, a, w, warn: ts, fire: ts + warn, end: ts + warn + life });
  }
  return out;
};

P.beams = (buf, list, t, cols = [[255, 255, 255], [255, 255, 255]]) => {
  const W = buf.w, H = buf.h, light = new Float32Array(W * H);
  let glow = 0, any = false;
  for (const b of list) {
    if (t < b.warn || t >= b.end + 0.2) continue;
    const ca = Math.cos(b.a), sa = Math.sin(b.a);
    if (t < b.fire) {
      const k = (t - b.warn) / (b.fire - b.warn);
      if (!(Math.floor(t * 14) % 2 === 0 || k > 0.75)) continue;
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++) {
          const wx = x + buf.ox, wy = y + buf.oy, d = Math.abs((wx - b.x) * sa - (wy - b.y) * ca);
          const along = (wx - b.x) * ca + (wy - b.y) * sa;
          if (d < 0.6 && (Math.floor(along / 3) % 2 === 0 || k > 0.6)) buf.put(y * W + x, P.col(P.mix(P.unpack(buf.px[y * W + x]), cols[cols.length - 1], 0.45 + 0.45 * k)));
        }
      continue;
    }
    any = true;
    const f = t - b.fire, life = b.end - b.fire;
    const grow = 1 - Math.pow(1 - Math.min(f / 0.05, 1), 3);
    const shrink = Math.max(0, 1 - Math.pow(Math.max(0, (f - life * 0.55) / (life * 0.45 + 0.2)), 2));
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        const wx = x + buf.ox, wy = y + buf.oy, d = Math.abs((wx - b.x) * sa - (wy - b.y) * ca);
        const along = (wx - b.x) * ca + (wy - b.y) * sa;
        const wob = 1 + 0.12 * Math.sin(along / 5 + f * 70) + 0.06 * Math.sin(along / 2.3 - f * 110);
        const w = b.w * grow * shrink * wob, o = Math.max(d - w, 0);
        const core = P.clamp(w - d + 0.5);
        const bloom = Math.exp(-o / (b.w * 0.6 + 1.5)) * grow * shrink;
        const scatter = Math.exp(-o / 22) * 0.18 * grow * shrink;
        const v = Math.max(core, bloom * 0.85, scatter), i = y * W + x;
        if (v > light[i]) light[i] = v;
      }
    glow += 0.06 * grow * shrink + (f < 0.06 ? 0.4 * (1 - f / 0.06) : 0);
  }
  if (any)
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        const i = y * W + x, v = light[i];
        if (v <= 0.01) continue;
        const q = v * 4, base = Math.floor(q), fr = q - base;
        const lv = P.clamp((base + (fr > 0.6 || (fr > 0.4 && P.bt(x + buf.ox, y + buf.oy) - 0.5 / 16 > 0.5) ? 1 : 0)) / 4);
        if (lv <= 0) continue;
        const src = P.unpack(buf.px[i]), tint = P.ramp(cols, lv);
        buf.put(i, P.col(P.mix(src, tint, lv)));
      }
  if (glow > 0) {
    const k = Math.min(glow, 0.6) * 0.5;
    for (let i = 0; i < W * H; i++) buf.put(i, P.col(P.mix(P.unpack(buf.px[i]), [255, 255, 255], k)));
  }
  return glow;
};

P.novaNoise = () => {
  if (P.NOVA) return P.NOVA;
  const S = 160, a = new Float32Array(S * S), b = new Float32Array(S * S);
  for (let j = 0; j < S; j++)
    for (let i = 0; i < S; i++) {
      a[j * S + i] = P.noise(i * 0.16, j * 0.2);
      b[j * S + i] = P.noise(i * 0.4, j * 0.45);
    }
  return (P.NOVA = { S, a, b });
};

P.SMOKE_GREEN = {
  smoke: [[6, 22, 12], [14, 48, 24], [26, 82, 36], [44, 124, 50], [76, 176, 66], [130, 226, 98], [200, 255, 168], [240, 255, 228]],
  ring: [[236, 255, 220], [130, 240, 100], [50, 170, 60]],
  core: [[245, 255, 235], [150, 245, 120], [60, 180, 64]],
  puff: [[70, 160, 66], [34, 96, 44]],
  spark: [[220, 255, 200], [100, 230, 90]],
  gather: [[60, 170, 60], [230, 255, 210], [90, 220, 80]],
};

P.novaSmoke = (buf, x, te, t, opt = {}) => {
  const C = opt.cols || P.SMOKE_GREEN, fade = opt.fade ?? 1, front = !!opt.front, S = opt.scale ?? 1;
  if (fade <= 0 || te < -0.5) return;
  const NN = P.novaNoise(), NS = NN.S, wrap = (v) => ((Math.round(v) % NS) + NS) % NS;
  if (te < 0) {
    if (front) return;
    const c = (te + 0.5) / 0.5;
    buf.blob(x, -4 * S, (2 + 8 * c) * S, P.mix(C.gather[0], C.gather[1], c), (0.4 + 0.6 * c) * fade, 0.6);

const loadBuf = (src) => new Promise((res) => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"); c.width = im.width; c.height = im.height; const x = c.getContext("2d"); x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, im.width, im.height); const b = new P.Buf(im.width, im.height); b.px.set(new Uint32Array(d.data.buffer)); res(b); }; im.src = src; });
const G = { cats: {}, lv: {}, sp: {} };
async function load() {
  const cw = A.cat.w, ch = A.cat.h, n = A.cat.mouth.length;

  for (const k of CATS) G.cats[k] = slice(await loadBuf(A.cat.sheets[k]));

}

// ---------- Ember's breath: Codixel's Breath heat grid, shorter reach (cooling), clipped at walls ----------
class CatBreath extends P.Breath {
  constructor(o) { super(o); this.cool = o.cool; this.active = 0; }
  step(on = true, steps = 3) {
    const a = this.a, V = this.V, ROWS = this.ROWS; let sd = this.seed, any = 0;
    const rnd = () => { sd ^= sd << 13; sd ^= sd >>> 17; sd ^= sd << 5; return (sd >>> 0) / 4294967296; };
    for (let s = 0; s < steps; s++) {
      for (let v = 0; v < V; v++) { const e = Math.min(v - 16, V - 17 - v); a[v] = on && e >= 0 ? Math.max(0, Math.min(36, 22 + e * 1.4) - (rnd() < 0.15 ? 8 : 0)) : 0; }
      for (let k = ROWS - 1; k >= 1; k--) {
        const up = (k + s) & 1, o = k * V, ip = o - V;
        for (let q = 0; q < V; q++) { const v = up ? q : V - 1 - q, src = a[ip + v], r = rnd() * 3, ri = r | 0, nv = v + ri - 1; if (nv < 0 || nv >= V) continue; const dec = r - ri < this.cool ? 1 : 0; const nvv = src > dec ? src - dec : 0; a[o + nv] = nvv; any |= nvv; }
      }
    }
    this.seed = sd; this.active = any;
  }
  prepare(hx, hy, aA, aB, t, open) {
    const V = this.V, mid = (aA + aB) / 2, half = ((aB - aA) / 2) * (0.25 + 0.75 * open) * (V - 1) / (V - 19);
    this.hx = hx; this.hy = hy; this.dA = (half * 2) / (V - 1); this.lo = mid - half; this.idA = 1 / this.dA;
    for (let k = 0; k < this.LMAX; k++) this.wind[k] = Math.sin(k * 0.06 - t * 7) * (1 + k * 0.02) - this.lo * this.idA;
  }
  collide(hit) {
    if (!this.active) return;
    const a = this.a, V = this.V, R = this.ROWS;
    for (let v = 0; v < V; v++) {
      let blocked = false;
      for (let r = 1; r < R; r++) {
        const i = r * V + v; if (!a[i] && !blocked) continue;
        if (blocked) { a[i] = 0; continue; }
        const k = 2 * r + 1, th = (v + 0.5 - this.wind[k]) * this.dA, px = this.hx + Math.cos(th) * k, py = this.hy + Math.sin(th) * k;
        if (hit(px, py, a[i])) { blocked = true; a[i] = 0; }
      }
    }
  }
  drawTo(buf, floor) {
    if (!this.active) return;
    const LMAX = this.LMAX, V = this.V, a = this.a, pal = this.pal, hx = this.hx, hy = this.hy, idA = this.idA, lo = this.lo, TAU = Math.PI * 2;
    const I0 = Math.max(0, Math.floor(hx - LMAX) - buf.ox), I1 = Math.min(buf.w - 1, Math.ceil(hx + LMAX) - buf.ox);
    const J0 = Math.max(0, Math.floor(hy - LMAX) - buf.oy), J1 = Math.min(buf.h - 1, floor - buf.oy);
    for (let j = J0; j <= J1; j++) {
      const dy = j + buf.oy + 0.5 - hy;
      for (let i = I0; i <= I1; i++) {
        const dx = i + buf.ox + 0.5 - hx, k = Math.sqrt(dx * dx + dy * dy) | 0;
        if (k < 2 || k >= LMAX) continue;
        let th = Math.atan2(dy, dx); if (lo > Math.PI / 2 && th < 0) th += TAU;
        const uu = th * idA + this.wind[k]; if (uu < 0 || uu >= V) continue;
        const I = a[(k >> 1) * V + (uu | 0)]; if (I >= 5) buf.px[j * buf.w + i] = pal[I];
      }
    }
  }
}

let who = "ember", LV, LW, LWpx, tiles, ents, iceHp = new Map();
function buildLevel(key) {
  LV = A.levels[key]; LW = LV.LW; LWpx = LW * T;
  tiles = LV.map.map((r) => r.split(""));
  ents = { herbs: [], foes: [], beacons: [], goal: null, start: null, nodes: [], gates: [], vents: [], puffs: [], plats: [], frozen: [] };
  iceHp.clear();
  const beaconType = { ember: "lantern", volt: "lamp", frost: "fountain" }[key];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < LW; x++) {
    const c = tiles[y][x], wx = x * T, wy = y * T, ground = wy + T;
    if (c === "P") ents.start = { x: wx, y: ground };
    else if (c === "f") ents.herbs.push({ x: wx + 2, y: wy, got: false, ph: x * 0.7 });
    else if (c === "s") ents.foes.push({ type: "snow", x: wx + 1, y: ground - 13, w: 14, h: 13, vx: -0.35, vy: 0, burn: 0, st: "roll", t: 0, roll: 0 });
    else if (c === "d") ents.foes.push({ type: "spool", x: wx - 2, y: ground - 17, w: 20, h: 17, vx: -0.35, vy: 0, burn: 0, st: "roll", t: 0, roll: 0 });
    else if (c === "t") ents.foes.push({ type: "bubble", x: wx + 1, y: ground - 19, base: ground - 19, w: 14, h: 14, vx: -0.3, vy: 0, burn: 0, st: "roll", t: x * 0.5, roll: 0, sq: 0, minX: wx - 3 * T }); // drifts no further than 3 tiles left of its start
    else if (c === "w") ents.foes.push({ type: "sparkle", x0: wx + 3, y0: wy + 2, x: wx + 3, y: wy + 2, w: 10, h: 12, burn: 0, st: "fly", t: x * 0.37, flame: new P.Flame({ height: 13, width: 6, speed: 2.4, rough: 1.1, swayAmp: 3, bits: 0.25, cols: [[60, 100, 170], [100, 150, 220], [150, 200, 245], [210, 236, 255], [250, 254, 255]] }) });
    else if (c === "c") {
      const b = { type: beaconType, lit: false, t: 0 };
      if (beaconType === "lantern") Object.assign(b, { x: wx, y: ground - 34, w: 16, h: 34, flame: new P.Flame({ height: 7, width: 2.6, speed: 2.6, rough: 0.9, swayAmp: 1, bits: 0 }) });
      if (beaconType === "lamp") Object.assign(b, { x: wx, y: ground - 40, w: 16, h: 40 });
      if (beaconType === "fountain") Object.assign(b, { x: wx - 5, y: ground - 36, w: 26, h: 36 });
      ents.beacons.push(b);
    } else if (c === "L") {
      if (key === "ember") ents.goal = { type: "brazier", x: wx - 10, y: ground - 40, w: 36, h: 40, lit: false, flame: new P.Flame({ height: 30, width: 11, speed: 2.4, rough: 1.1, swayAmp: 6, bits: 0.35 }), smoke: new P.Smoke({ height: 60 }) };
      if (key === "volt") ents.goal = { type: "generator", x: wx - 10, y: ground - 64, w: 36, h: 64, lit: false };
      if (key === "frost") ents.goal = { type: "bigFountain", x: wx - 16, y: ground - 64, w: 48, h: 64, lit: false };
    } else if (c === "n") ents.nodes.push({ x: wx + 1, y: ground - 16, w: 14, h: 16, on: false, gate: null });
    else if (c === "v") ents.vents.push({ x: wx - 1, y: ground - 5, t: (x * 37 + 7) % 150 }); // phase: the first vent puffs about 1 s after a fast run arrives
    if (c === "I") iceHp.set(y * LW + x, 0);
    if ("Pfsdtwcnv L".includes(c)) tiles[y][x] = ".";
  }
  if (ents.goal) Object.assign(ents.goal, { power: 0, hinted: false, heated: false });
  // gates: vertical runs of G; each power node opens the nearest gate to its right
  for (let x = 0; x < LW; x++) { const rows = []; for (let y = 0; y < ROWS; y++) if (tiles[y][x] === "G") rows.push(y); if (rows.length) ents.gates.push({ tx: x, rows, open: false, t: 0 }); }
  // the level's first bubble starts 1.2 s further along its drift
  { const first = ents.foes.filter((f) => f.type === "bubble").sort((a, b) => a.x - b.x)[0]; if (first) for (let i = 0; i < 72; i++) { first.t += 1 / 60; bubbleDrift(first); } }
  for (const n of ents.nodes) n.gate = ents.gates.filter((g) => g.tx * T > n.x).sort((a, b) => a.tx - b.tx)[0] || null;
}
const tileAt = (tx, ty) => (tx < 0 || tx >= LW ? "=" : ty < 0 ? "." : ty >= ROWS ? "#" : tiles[ty][tx]);
const solid = (c) => c === "#" || c === "=" || c === "I" || c === "F" || c === "G" || c === "S";

const edge = (k) => k === "jump" || k === "fire" || k === "left" || k === "right";

// the pad: any finger on the left half walks left, on the right half walks right; sliding across switches direction
const pad = document.getElementById("pad"), padPtr = new Map();
function padUpdate() { const r = pad.getBoundingClientRect(); let l = 0, rt = 0; for (const x of padPtr.values()) { if (x < r.left + r.width / 2) l = 1; else rt = 1; }
  if (l && !keys.left) pressed.left = 1; if (rt && !keys.right) pressed.right = 1; keys.left = l; keys.right = rt; pad.classList.toggle("L", !!l); pad.classList.toggle("R", !!rt); }
